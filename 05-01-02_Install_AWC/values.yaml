global:
  registries:
    internal: docker-private.infra.cloudera.com 
    default: docker-private.infra.cloudera.com
  registryCredsSecret: awc-console-registry-creds

taikunSecret: awc-taikun-secrets

dns:
  baseDomain: "a19881.test.cldr.work"
  consoleDomain: "student<XX>.a19881.test.cldr.work"

preInstallCheckSingleConsole:
  enabled: false

externalDns:
  enabled: true
  chartValues:
    provider:
      name: aws
    aws:
      region: us-west-2
      zoneType: private
    extraArgs:
      zone-id-filter: Z03938622CM271M1MBTUB
    policy: upsert-only
    interval: "30s"
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: student<XX>-route53-creds
            key: aws-access-key-id
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: student<XX>-route53-creds
            key: aws-secret-access-key
      - name: AWS_DEFAULT_REGION
        value: "us-west-2"

        policy: sync
        interval: "30s"


